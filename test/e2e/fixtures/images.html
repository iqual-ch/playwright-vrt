<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Images</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  h1 { margin: 40px; font: 32px/1 sans-serif; color: #000; }
  img { display: block; width: 400px; height: 200px; margin: 40px; }
  .spacer { height: 2400px; }
</style>
</head>
<body>
<h1>Images</h1>
<img id="image" src="/image.png" alt="">
<div class="spacer"></div>
<script>
  // Stand-in for a responsive image: Chromium fires "resize" during a full-page capture and the
  // image loads again from the same URL. Only the browser cache keeps that off the network.
  const image = document.getElementById('image');
  window.addEventListener('resize', () => {
    const src = image.src;
    image.src = '';
    image.src = src;
  });
</script>
</body>
</html>
