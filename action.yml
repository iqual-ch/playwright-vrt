name: 'iqual Visual Regression Testing'
description: 'Run visual regression tests using Playwright. Compares screenshots between a reference and test URL.'
author: 'iqual'

branding:
  icon: 'image'
  color: 'green'

inputs:
  config:
    description: 'Path to playwright-vrt.config.json file'
    required: true
    default: 'playwright-vrt.config.json'
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '24.15'
  cache:
    description: 'Enable caching of baseline snapshots'
    required: false
    default: 'true'
  cache-key:
    description: 'Custom cache key for baseline snapshots'
    required: false
    default: 'default'
  upload-report:
    description: 'Upload Playwright HTML report as artifact'
    required: false
    default: 'true'
  report-name:
    description: 'Name of the uploaded report artifact'
    required: false
    default: 'vrt-report'
  working-directory:
    description: 'Working directory for the VRT run'
    required: false
    default: '.'
  summary-retention-days:
    description: 'Retention (days) of the small summary artifact (summary.md, results.json, plan.json)'
    required: false
    default: '90'

outputs:
  result:
    description: 'Test result: "passed" or "failed"'
    value: ${{ steps.run-vrt.outputs.result }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Restore baseline cache
      if: inputs.cache == 'true'
      uses: actions/cache@v5
      with:
        path: ${{ inputs.working-directory }}/playwright-snapshots
        key: vrt-baseline-${{ inputs.cache-key }}-${{ hashFiles(inputs.working-directory != '.' && format('{0}/{1}', inputs.working-directory, inputs.config) || inputs.config) }}

    - name: Run Visual Regression Tests
      id: run-vrt
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        ARGS="run --config ${{ inputs.config }}"

        echo "Running: npx @iqual/playwright-vrt $ARGS"

        set +e
        npx @iqual/playwright-vrt $ARGS
        EXIT_CODE=$?
        set -e

        if [ -f playwright-report/summary.md ]; then
          cat playwright-report/summary.md >> "$GITHUB_STEP_SUMMARY"
        fi

        if [ "$EXIT_CODE" -eq 0 ]; then
          echo "result=passed" >> "$GITHUB_OUTPUT"
        else
          echo "result=failed" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE
        fi

    - name: Upload VRT report
      if: always() && inputs.upload-report == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.report-name }}
        path: ${{ inputs.working-directory }}/playwright-report/

    # Small, long-lived artifact for post-mortems (the full report expires with the org retention)
    - name: Upload VRT summary
      if: always() && inputs.upload-report == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.report-name }}-summary
        retention-days: ${{ inputs.summary-retention-days }}
        if-no-files-found: ignore
        path: |
          ${{ inputs.working-directory }}/playwright-report/summary.md
          ${{ inputs.working-directory }}/playwright-report/summary.json
          ${{ inputs.working-directory }}/playwright-report/results.json
          ${{ inputs.working-directory }}/playwright-snapshots/plan.json
